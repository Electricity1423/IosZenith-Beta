name: Build iOS IPA (unsigned)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q ZenithiOS.zip
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install iOS workload
        run: dotnet workload install ios
      - name: Build ffmpeg
        run: |
          cd ZenithiOS/ffmpeg-ios/scripts
          chmod +x build-ffmpeg-ios.sh
          SLICES="device" ./build-ffmpeg-ios.sh
      - name: Build app (unsigned)
        run: |
          cd ZenithiOS
          dotnet build src/ZenithiOS/ZenithiOS.csproj -c Release -f net8.0-ios -r ios-arm64 \
            -p:EnableCodeSigning=false -p:CodesignRequireProvisioningProfile=false \
            -p:ValidateXcodeVersion=false
      - name: Package IPA
        run: |
          cd ZenithiOS
          APP=$(find src/ZenithiOS/bin -name '*.app' -type d | head -n 1)
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qr ZenithMIDI-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ZenithMIDI-unsigned-ipa
          path: ZenithiOS/ZenithMIDI-unsigned.ipa
